# --- Site ---------------------------------------------------------------
title: "ProtectoRTD"
description: "Статьи и заметки / Articles and notes"
url: "https://protectorrtd.github.io"
baseurl: ""
lang: "ru"
timezone: "Europe/Budapest"

# --- Theme --------------------------------------------------------------
theme: jekyll-theme-minimal

# Плагины из белого списка GitHub Pages.
# jekyll-seo-tag нужен для тега {% seo %} в _layouts/default.html.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# --- Markdown -----------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    guess_lang: true

# --- Theme options ------------------------------------------------------
show_downloads: false
google_analytics:

favicon: "/assets/img/favicon.png"

# Логотип в правом верхнем углу. Пусто = логотипа нет.
# Чтобы поставить — укажите путь, например "/assets/img/logo.png"
logo_src: ""
logo_href: "https://github.com/ProtectorRTD"
logo_background: "#00cce4"

# --- Front matter defaults ---------------------------------------------
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
      author:
        - "ProtectoRTD"
  - scope:
      path: "articles/ru"
    values:
      lang: "ru-RU"
  - scope:
      path: "articles/en"
    values:
      lang: "en-US"

# --- Build --------------------------------------------------------------
exclude:
  - .dist
  - .vscode
  - README.md
  - docs        # внутренняя документация и концепты — не публикуется
  - drafts      # черновики — не публикуются
  - Gemfile
  - Gemfile.lock
  - vendor
